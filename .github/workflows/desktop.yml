name: Desktop packages
on:
  pull_request:
    paths: ['src-tauri/**', 'src/**', 'package*.json', 'project-templates.json', '.github/workflows/desktop.yml', 'scripts/native-*']
  workflow_dispatch:
  push:
    branches: [design/desktop-memory-runtime, main]
    paths: ['src-tauri/**', 'src/**', 'package*.json', 'project-templates.json', '.github/workflows/desktop.yml', 'scripts/native-*']
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - run: npm run test:synapse
      - name: Native core and PTY tests
        timeout-minutes: 8
        run: npm run test:native
      - if: runner.os == 'Windows'
        run: npm run desktop:build -- --bundles nsis
      - if: runner.os == 'macOS'
        run: npm run desktop:build -- --bundles app
      - if: runner.os == 'macOS'
        run: node scripts/native-dmg.mjs
      - name: Actual native executable and renderer smoke
        run: node scripts/native-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            artifacts/native-*.json
          if-no-files-found: warn
